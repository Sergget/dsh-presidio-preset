# 验证覆盖层：把 presidio-pii 作为 agent-preset 声明注入 web profile。
# 用法：dsh --profile web --patch 本文件 --dump-config 验证组合成功。
- insert:
    - id: preset-presidio-pii
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: presidio-pii
        name: PII 防护模式
        description: 敏感文档 PII 脱敏工作流：处理含个人信息/身份证/手机号等敏感数据的文档或文本时，先用 presidio-pii CLI 脱敏再进入 LLM 上下文，响应后无损还原。
        order: 3
        plugins: []
