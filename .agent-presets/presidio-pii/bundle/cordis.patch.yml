# Note: The standalone preset bundle has been merged with the former guard,
# guard-fs and guard-terms halves into the unified bundle at:
#   plugins/dsh-presidio-pii/
# Keep this file valid and free of hardcoded paths for backward reference.
- insert:
    - id: preset-presidio-pii
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: presidio-pii
        name: PII 防护模式
        description: PII 防护模式：由一体化插件 dsh-presidio-pii 在工具结果与安全文件通道进入上下文前强制脱敏，展示侧自动还原。
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model, running with the
                PII-Protection preset. PII redaction is enforced by the runtime, not by
                your discipline: dsh-presidio-pii redacts tool results before they enter
                your context and restores placeholders on the display side.

                RUNTIME GUARD & SAFE FS SURFACE (active in this preset):
                - File access is narrowed to `read_redacted`, `write_raw`, `restore`, and `ls`.
                - `read_image` is hidden in this preset.
                - If a tool result is blocked with `[pii-guard]`, report it and do not bypass.

                Global Response Requirements:
                1. Always provide a summary and conclusion at the end of each response.
                2. When asking clarifying questions mid-task, use Simplified Chinese.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: pii-guard
            name: 'dsh-presidio-pii/guard'
            config:
              dataDir: !!js dshHomePath('data', 'presidio-pii')
          - id: pii-guard-fs
            name: 'dsh-presidio-pii/fs'
            config:
              dataDir: !!js dshHomePath('data', 'presidio-pii')
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-presidio-pii/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
