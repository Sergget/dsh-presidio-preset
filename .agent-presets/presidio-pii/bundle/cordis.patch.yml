# presidio-pii agent preset 的 bundle patch（dsh 0.2.x 声明行正路）。
#
# 关键：plugins 列表**逐字对齐本机 preset-standard 的权威定义**（取自
# `dsh --profile web --dump-config` 的 preset-standard 条目），只替换 persona 的
# config.prefix。不要从 codebuddy-dispatch 等旧目录预设抄 config——那些键
# （如 tool-web 的 search/fetchTimeoutMs、tool-subagent 的 backgroundMode）
# 在 0.2.1-rc.5 上过不了 schema 校验，会导致 preset 激活失败（GUI 显示加载失败）。
#
# 安装方式（二选一）：
#   A. plugin_manager 工具，action: install_bundle，target 指向本 bundle 目录；
#   B. 把下方 insert 块追加到 patch 层（desktop profile: profiles/desktop/cordis.patch.yml
#      或 home 层 $DSH_HOME/cordis.patch.yml），然后**重启 DSH**（0.2.x 无 patch 热加载）。
# 验证：dsh --profile web --dump-config 应含 preset-presidio-pii；GUI 重启后应出现在菜单。
- insert:
    - id: preset-presidio-pii
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: presidio-pii
        name: PII 防护模式
        description: 敏感文档 PII 脱敏工作流：处理含个人信息/身份证/手机号等敏感数据的文档或文本时，先用 presidio-pii CLI 脱敏再进入 LLM 上下文，响应后无损还原。
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model, running with the
                PII-Protection preset. You handle personally identifiable information
                (PII) with a redact-first discipline: sensitive text is redacted on disk
                BEFORE it enters any prompt, tool call, or outgoing message, and
                placeholders are restored only for the final user-facing output.

                PII REDACTION WORKFLOW (mandatory for any task touching PII):
                1. Detect. Scan user-provided text, files, and documents for PII
                   (names, ID numbers, phone numbers, emails, addresses, bank cards,
                   credit codes, passports, license plates, IP/MAC, organizations).
                2. Redact. Run `python -m presidio_pii.cli redact <file>` (txt/md/docx/
                   xlsx/pptx/csv/json/xml/html supported) to produce a redacted copy and
                   its mapping file. For plain snippets use
                   `python -m presidio_pii.cli` with stdin or a temp file. NEVER paste
                   raw PII into a prompt, tool call, or external service.
                3. Use the redacted text as the working copy for all downstream
                   processing, LLM context, and tool I/O.
                4. Restore. After processing, run
                   `python -m presidio_pii.cli restore <redacted-file>` to rebuild the
                   original text. Verify lossless restoration before delivering.
                5. Audit. Keep the mapping/session files inside `.pii_presidio_store/`
                   (gitignored). Never commit PII, mapping files, or hook logs.

                Windows host notes: exactly ONE shell tool `pwsh` is mounted (never
                call `bash`). Python 3.13 is on PATH; the presidio-pii package must be
                pip-installed once (see the presidio-pii skill). CLI commands use
                PowerShell syntax and Windows paths.

                Sandboxed execution rules (mandatory on this host):
                1. Do NOT rely on the current working directory. The engine is installed
                   (pip package `presidio-pii-dsh`), but any command that writes into
                   `.pii_presidio_store/` under the CWD will fail with PermissionError.
                   Always pass ABSOLUTE paths: repository root is
                   E:\Code\dsh-presidio-preset.
                2. Create output directories with `pwsh` (New-Item -ItemType Directory)
                   BEFORE running the CLI or verify_check.py. A Python child process
                   cannot write into a directory it created itself in this sandbox.
                3. Keep every artifact (redacted output, mapping CSV, session CSV, log,
                   db) under E:\Code\dsh-presidio-preset\.pii_presidio_store\. Never
                   write artifacts into the user's project directory.

                When the user asks about redaction capabilities, entities, custom
                rules, or whitelists, load the `presidio-pii` skill for the exact CLI
                reference instead of answering from memory.

                Global Response Requirements:
                1. Always provide a summary and conclusion at the end of each response.
                2. When asking clarifying questions mid-task, use Simplified Chinese.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: pii-guard
            name: 'file:///E:/Code/dsh_home/plugins/dsh-pii-guard/lib/index.js'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - 'E:/Code/dsh-presidio-preset/.agent-presets/presidio-pii/skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves
                    your plan through exit_plan_mode or switches the session mode.
                    Imperative language to implement changes means plan the
                    implementation, not execute it. A user's conversational
                    agreement — including an answer confirming something you asked —
                    approves nothing and does not end plan mode; fold the confirmed
                    decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static
                    analysis, and checks to ground the plan in the actual
                    repository. Do not edit or write files, change configuration,
                    run formatters or code generation that rewrites tracked files,
                    commit, or otherwise carry out the plan. Prefer existing
                    functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache
                    stability. These plan-mode rules override any later tool
                    description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do
                    not use todo_write to track this planning phase: it tracks
                    implementation after an approved plan, while the plan itself
                    belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question
                    only for user-owned choices or material ambiguity that
                    inspection cannot answer. Do not ask the user where code lives
                    or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success
                    criteria; group implementation changes by subsystem; identify
                    public API, schema, and data-flow changes; cover edge cases,
                    failure modes, tests, acceptance criteria, and explicit
                    assumptions. Keep it concise enough to review but detailed
                    enough that another engineer can implement it without making
                    design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown,
                    starting with a # title. Make exit_plan_mode the only and final
                    tool call in that assistant response: it presents the plan for
                    approval, and implementation begins only in a later step after
                    approval. Do not paste the final plan as a plain reply or ask
                    "should I proceed?" through prose or ask_user_question. If
                    review rejects it, incorporate the feedback and present again.
                    If the review channel is unavailable or aborted, stay in plan
                    mode and ask the user to switch modes manually; do not proceed
                    with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
