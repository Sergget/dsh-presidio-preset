[build-system]
# 构建后端锁定到已验证版本：跨时间构建哈希才可复现（升级需重建并更新 release 清单）
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-pii-dsh"
version = "0.1.0"
description = "Local PII redaction and restoration plugin for DeepSeek Harness (zero spaCy/PyTorch, regex + checksum based)"
dependencies = [
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# 可选: 中文分词, 用于校验实体的词边界与词性 (人名/地名精度显著提升)
segment = [
    "jieba>=0.42",
]

[project.scripts]
presidio-pii = "presidio_pii.cli:main"

[tool.setuptools.packages.find]
include = ["presidio_pii*"]

[tool.setuptools.package-data]
presidio_pii = ["assets/*.txt"]
